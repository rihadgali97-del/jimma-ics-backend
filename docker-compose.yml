version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jimma_ics_api
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://jimma_ics:${MYSQL_PASSWORD:-changeme}@mysql:3306/jimma_ics
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  mysql:
    image: mysql:8.0
    container_name: jimma_ics_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jimma_ics
      MYSQL_USER: jimma_ics
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jimma_ics_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  uploads_data: