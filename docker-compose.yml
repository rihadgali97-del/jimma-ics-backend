services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jimma_ics_api
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    env_file:
      - .env
    environment:
      PORT: 4000
      DATABASE_URL: mysql://jimma_ics:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/jimma_ics
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
  mysql:
    image: mysql:8.0
    container_name: jimma_ics_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jimma_ics
      MYSQL_USER: jimma_ics
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jimma_ics_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  uploads_data: